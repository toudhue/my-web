<style>
    :root{
        --bg:#1e1e24; --card:#26262e; --card2:#2c2c36;
        --line:#3a3a46; --amber:#ffb703; --teal:#219ebc; --deep:#023047;
        --txt:#eceff4; --mut:#9aa0ad;
    }
    *{box-sizing:border-box;}
    body{
        font-family:"Segoe UI","Microsoft JhengHei",Arial,sans-serif;
        background:radial-gradient(1200px 600px at 50% -200px,#2a2a36 0%,var(--bg) 60%);
        color:var(--txt); margin:0; padding:0 16px 80px; line-height:1.7;
    }
    .top{
        max-width:880px; margin:0 auto; padding:34px 0 10px;
        display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    }
    .title h1{color:var(--amber); margin:0; font-size:30px; letter-spacing:1px;}
    .title p{color:var(--mut); margin:6px 0 0; font-size:14px;}
    .back{
        text-decoration:none; color:var(--txt); background:var(--deep);
        border:2px solid var(--teal); border-radius:10px; padding:10px 18px;
        font-size:15px; transition:.25s; white-space:nowrap;
    }
    .back:hover{background:var(--teal); color:var(--deep); transform:translateY(-2px);}

    /* 分類篩選 */
    .filters{max-width:880px; margin:14px auto 4px; display:flex; gap:8px; flex-wrap:wrap;}
    .chip{
        cursor:pointer; user-select:none; font-size:13px; padding:6px 14px; border-radius:999px;
        background:var(--card); border:1px solid var(--line); color:var(--mut); transition:.2s;
    }
    .chip:hover{color:var(--txt);}
    .chip.on{color:#fff; border-color:transparent;}
    .chip[data-k="全部"].on{background:var(--teal);}

    /* 時間軸 */
    .timeline{max-width:880px; margin:22px auto 0; position:relative;}
    .ver{
        position:relative; background:var(--card); border:1px solid var(--line);
        border-left:4px solid var(--amber); border-radius:14px;
        padding:18px 22px 8px; margin:0 0 22px;
        box-shadow:0 6px 20px rgba(0,0,0,.25);
    }
    .ver-head{display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
    .date{
        font-size:20px; font-weight:700; color:var(--amber);
        background:rgba(255,183,3,.1); padding:4px 14px; border-radius:8px;
    }
    .latest{
        font-size:12px; color:#0b2a12; background:#4ade80; font-weight:700;
        padding:3px 10px; border-radius:999px;
    }
    .count{font-size:12px; color:var(--mut); margin-left:auto;}

    ul.items{list-style:none; margin:0; padding:0;}
    li.item{
        display:flex; gap:12px; align-items:flex-start;
        padding:10px 0; border-top:1px dashed rgba(255,255,255,.06);
    }
    li.item:first-child{border-top:0;}
    .badge{
        flex:0 0 auto; font-size:12.5px; font-weight:700; color:#fff;
        padding:3px 10px; border-radius:7px; min-width:52px; text-align:center; margin-top:2px;
    }
    .b-新增{background:#2a9d8f;}
    .b-調整{background:#3d7dc9;}
    .b-修復{background:#e76f51;}
    .body{flex:1 1 auto; min-width:0;}
    .body .txt{color:var(--txt);}
    .body .detail{color:var(--mut); font-size:14px; margin-top:3px; padding-left:2px; white-space:pre-wrap;}
    .foot{max-width:880px; margin:10px auto 0; text-align:center; color:var(--mut); font-size:13px;}
    @media(max-width:560px){
        .title h1{font-size:24px;}
        .badge{min-width:46px; font-size:12px;}
        .ver{padding:16px 16px 6px;}
    }
</style>
</head>

<script>
(function(){
    const KEYS = ['新增','調整','修復','稅金','活動','待修復','備案','慶祝'];  // 解析用：辨識原文所有標籤
    const ALLOWED = ['新增','調整','修復'];   // 只顯示這幾類（含「全部」）；其餘標籤的項目一律隱藏
    const raw = document.getElementById('raw').textContent.replace(/\r/g,'');
    const lines = raw.split('\n');
    const headRe = /^(\d+\/\d+(?:-\d+)?)\s*版本更新說明\s*$/;
    const itemRe = /^\s*\d+[\.．]?\s+(.*)$/;   // 「數字.」開頭 = 一條項目

    const sections = [];
    let cur = null, curItem = null;
    for (const rawLine of lines){
        const line = rawLine.replace(/\s+$/,'');
        if (!line.trim()) { continue; }
        const hm = line.match(headRe);
        if (hm){ cur = {date:hm[1], items:[]}; sections.push(cur); curItem = null; continue; }
        if (!cur) continue;
        const im = line.match(itemRe);
        if (im){
            let rest = im[1].trim();
            let key = KEYS.find(k => rest.startsWith(k));
            let text = key ? rest.slice(key.length).trim() : rest;
            curItem = {key: key || '其他', text, details: []};
            cur.items.push(curItem);
        } else {
            // 承接上一條的補充說明
            if (curItem) curItem.details.push(line.trim());
            else { curItem = {key:'其他', text:line.trim(), details:[]}; cur.items.push(curItem); }
        }
    }

    // 渲染（只留白名單分類的項目；整段沒有符合項目就不顯示）
    const tl = document.getElementById('timeline');
    let firstShown = true;
    sections.forEach((sec) => {
        const items = sec.items.filter(it => ALLOWED.includes(it.key));
        if (!items.length) return;
        const el = document.createElement('section');
        el.className = 'ver';
        let head = `<div class="ver-head"><span class="date">${sec.date}</span>` +
                   (firstShown ? `<span class="latest">最新</span>` : ``) +
                   `<span class="count">${items.length} 項</span></div>`;
        firstShown = false;
        let ul = '<ul class="items">';
        items.forEach(it => {
            const det = it.details.length
                ? `<div class="detail">${it.details.map(esc).join('\n')}</div>` : '';
            ul += `<li class="item" data-k="${it.key}">` +
                  `<span class="badge b-${it.key}">${it.key}</span>` +
                  `<div class="body"><span class="txt">${esc(it.text)}</span>${det}</div></li>`;
        });
        ul += '</ul>';
        el.innerHTML = head + ul;
        tl.appendChild(el);
    });

    // 篩選列（只有 全部 + 白名單）
    const used = ['全部', ...ALLOWED];
    const fbar = document.getElementById('filters');
    used.forEach((k, idx) => {
        const c = document.createElement('span');
        c.className = 'chip' + (idx === 0 ? ' on' : '');
        c.dataset.k = k;
        c.textContent = k;
        if (k !== '全部' && k !== '其他') c.style.borderColor = 'transparent';
        c.addEventListener('click', () => {
            document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
            c.classList.add('on');
            const sel = c.dataset.k;
            document.querySelectorAll('li.item').forEach(li => {
                li.style.display = (sel === '全部' || li.dataset.k === sel) ? '' : 'none';
            });
            // 隱藏整段沒有符合項目的版本卡
            document.querySelectorAll('.ver').forEach(v => {
                const any = [...v.querySelectorAll('li.item')].some(li => li.style.display !== 'none');
                v.style.display = any ? '' : 'none';
            });
        });
        fbar.appendChild(c);
    });
    // 讓彩色 chip 有底色提示
    const colorMap = {新增:'#2a9d8f',調整:'#3d7dc9',修復:'#e76f51'};
    document.querySelectorAll('.chip').forEach(c=>{
        const col = colorMap[c.dataset.k];
        if(col){ c.style.setProperty('--c',col);
            c.addEventListener('mouseenter',()=>{ if(!c.classList.contains('on')) c.style.color=col; });
            c.addEventListener('mouseleave',()=>{ if(!c.classList.contains('on')) c.style.color=''; });
        }
    });
    // on 狀態上色
    const styleOn = document.createElement('style');
    styleOn.textContent = Object.entries(colorMap).map(([k,v])=>`.chip[data-k="${k}"].on{background:${v};}`).join('\n');
    document.head.appendChild(styleOn);

    function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
})();
</script>
